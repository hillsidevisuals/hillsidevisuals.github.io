<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Nugent | Brand Intro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; font-family: 'Inter', sans-serif; }
        .intro-container { text-align: center; }
        .brand-name { font-size: 4rem; font-weight: 300; letter-spacing: -2px; clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); line-height: 1.2; margin: 0; }
        .tagline { font-size: 1rem; color: #888; font-weight: 300; margin-top: 1rem; opacity: 0; transform: translateY(20px); letter-spacing: 2px; text-transform: uppercase; }
        .line { width: 0; height: 1px; background: #444; margin: 2rem auto; }
    </style>
</head>
<body>
    <div class="intro-container">
        <h1 class="brand-name" id="name">TRINITY NUGENT</h1>
        <div class="line" id="line"></div>
        <div class="tagline" id="tag">ELEVATING PROFESSIONAL EXCELLENCE</div>
    </div>

    <script>
        const tl = gsap.timeline();
        
        // Uncover brand name
        tl.to("#name", {
            clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)",
            duration: 1.5,
            ease: "power4.inOut"
        })
        // Expand line
        .to("#line", {
            width: "100%",
            duration: 1,
            ease: "power2.out"
        }, "-=0.5")
        // Fade up tagline
        .to("#tag", {
            opacity: 1,
            y: 0,
            duration: 1,
            ease: "power2.out"
        }, "-=0.5");
    </script>
</body>
</html>
