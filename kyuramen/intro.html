<!-- fingerprint: P5 H4 E5 S5 R5 V4 -->
<!DOCTYPE html>
<!--
  Super Kyuramen brand intro. Bespoke, composed to the "bold-signal" concept (kinetic condensed
  signage): the SK chop drops in, the wordmark stamps up line by line, a signal-red bar wipes the
  frame, the Las Vegas lockup and tagline settle, one lantern-amber pulse. Matched Kyuramen brand,
  NOT a rebrand. Fluid 16:9 stage (cqw), holds its final lockup, small Replay control.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Super Kyuramen | Brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-ink:oklch(0.16 0.006 60);
    --color-void:oklch(0.075 0.004 60);
    --color-paper:oklch(0.95 0.012 85);
    --color-signal:oklch(0.56 0.22 27);
    --color-lantern:oklch(0.80 0.13 78);
    --color-muted:oklch(0.72 0.01 78 / 0.85);
    --line:oklch(0.95 0.012 85 / 0.16);
    --font-display:"Bebas Neue","Helvetica Neue",Arial,sans-serif;
    --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",-apple-system,"Segoe UI",sans-serif;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--color-void)}
  body{color:var(--color-paper);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:clamp(14px,4vw,32px)}
  .frame{position:relative;width:min(1120px,100%);aspect-ratio:16/9;container-type:inline-size;
    font-size:1cqw;background:var(--color-ink);overflow:hidden;box-shadow:0 20px 70px oklch(0 0 0 / 0.55)}
  .bg{position:absolute;inset:0;background:radial-gradient(58% 66% at 50% 42%,
    oklch(0.20 0.02 40) 0%,var(--color-ink) 60%,var(--color-void) 100%)}
  .glow{position:absolute;left:50%;top:44%;width:60cqw;height:60cqw;transform:translate(-50%,-50%);
    background:radial-gradient(circle,oklch(0.80 0.13 78 / 0.18) 0%,transparent 62%);
    opacity:0;animation:glow 1s var(--ease-out) 2.5s both}
  .edge{position:absolute;inset:3cqw;border:1px solid var(--line);pointer-events:none;z-index:4}

  .inner{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 6cqw;text-align:center}

  .lockup{display:flex;align-items:center;gap:2cqw;max-width:100%}
  .chop{width:clamp(30px,9cqw,150px);height:clamp(30px,9cqw,150px);flex:none;display:inline-flex;
    align-items:center;justify-content:center;background:var(--color-signal);color:var(--color-paper);
    font-family:var(--font-display);font-size:clamp(15px,4.4cqw,72px);line-height:1;letter-spacing:0.04em;
    border-radius:0;animation:chop-in .5s var(--ease-out) both}

  .stack{display:flex;flex-direction:column;align-items:flex-start;line-height:0.86}
  .word{font-family:var(--font-display);font-size:clamp(20px,9cqw,150px);letter-spacing:0.03em;
    text-transform:uppercase;overflow:hidden}
  .word span{display:inline-block;transform:translateY(110%);
    animation:stamp .44s var(--ease-out) both}
  .word.a span{animation-delay:.5s}
  .word.b span{animation-delay:.64s}

  .bar{position:absolute;left:0;top:0;height:100%;width:100%;background:var(--color-signal);z-index:5;
    transform:scaleX(0);transform-origin:left;animation:wipe 1.15s var(--ease-out) 1.1s both}

  .loc{margin-top:3cqw;display:flex;align-items:center;gap:1.4cqw;font-family:var(--font-display);
    font-size:clamp(11px,2.4cqw,38px);letter-spacing:0.18em;text-transform:uppercase;
    color:var(--color-lantern);opacity:0;animation:rise .6s var(--ease-out) 2s both}
  .loc i{width:3.4cqw;height:2px;background:var(--color-signal)}

  .tag{margin-top:2.4cqw;font-family:var(--font-body);font-weight:500;
    font-size:clamp(11px,1.9cqw,28px);color:var(--color-paper);opacity:0;
    animation:rise .6s var(--ease-out) 2.35s both}
  .meta{margin-top:3.4cqw;font-family:var(--font-body);font-weight:700;
    font-size:clamp(8px,1.15cqw,17px);letter-spacing:0.22em;text-transform:uppercase;
    color:var(--color-muted);opacity:0;animation:rise .6s var(--ease-out) 2.7s both}

  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .page-meta{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:0.2em;
    text-transform:uppercase;color:var(--color-muted)}
  .replay{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:0.16em;
    text-transform:uppercase;color:var(--color-paper);background:transparent;border:1px solid var(--line);
    padding:9px 16px;cursor:pointer}
  .replay:hover{border-color:var(--color-paper)}
  .visit{color:var(--color-muted);text-decoration:none;font-family:var(--font-body);font-size:12px;
    font-weight:700;letter-spacing:0.16em;text-transform:uppercase}
  .visit:hover{color:var(--color-paper)}

  @keyframes chop-in{from{opacity:0;transform:translateY(-40%) scale(0.7)}to{opacity:1;transform:none}}
  @keyframes stamp{to{transform:translateY(0)}}
  @keyframes wipe{0%{transform:scaleX(0);transform-origin:left}
    45%{transform:scaleX(1);transform-origin:left}
    55%{transform:scaleX(1);transform-origin:right}
    100%{transform:scaleX(0);transform-origin:right}}
  @keyframes rise{from{opacity:0;transform:translateY(0.8em)}to{opacity:1;transform:none}}
  @keyframes glow{0%{opacity:0}50%{opacity:1}100%{opacity:0.55}}

  @media (prefers-reduced-motion:reduce){
    .chop,.word span,.loc,.tag,.meta,.glow{animation:none;opacity:1;transform:none}
    .bar{display:none}
  }
  .replaying .chop,.replaying .word span,.replaying .bar,.replaying .loc,.replaying .tag,
  .replaying .meta,.replaying .glow{animation:none}
</style>
</head>
<body>
<main class="wrap">
  <section class="frame" aria-label="Super Kyuramen brand intro, six second reveal">
    <div class="bg" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="bar" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>
    <div class="inner">
      <div class="lockup">
        <span class="chop" aria-hidden="true">SK</span>
        <span class="stack">
          <span class="word a">
            <span>S</span><span>U</span><span>P</span><span>E</span><span>R</span>
          </span>
          <span class="word b">
            <span>K</span><span>Y</span><span>U</span><span>R</span><span>A</span><span>M</span><span>E</span><span>N</span>
          </span>
        </span>
      </div>
      <div class="loc"><i></i>Las Vegas · Chinatown<i></i></div>
      <p class="tag">Ramen by day. Izakaya by night.</p>
      <div class="meta">Now open in Hotai Plaza · @superkyuramen</div>
    </div>
  </section>
  <div class="row">
    <span class="page-meta">Super Kyuramen · brand intro · 6s</span>
    <button class="replay" type="button">Replay</button>
    <a class="visit" href="./">Visit the site</a>
  </div>
</main>
<script>
(function(){
  var frame = document.querySelector('.frame');
  var btn = document.querySelector('.replay');
  if(btn && frame){
    btn.addEventListener('click', function(){
      frame.classList.add('replaying');
      void frame.offsetWidth;
      frame.classList.remove('replaying');
    });
  }
})();
</script>
</body>
</html>
