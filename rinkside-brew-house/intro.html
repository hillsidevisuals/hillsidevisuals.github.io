<!DOCTYPE html>
<!-- Rinkside Brew House brand intro. Bespoke composition on the design system.
     Concept: a low light-sweep crosses the dark frame once (the rink lights coming up),
     the rink-corner mark draws, the condensed wordmark rises line by line behind the sweep,
     one steel-blue underline draws from the centre and holds. transform/opacity only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rinkside Brew House | Brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:oklch(0.19 0.022 250);
    --raised:oklch(0.26 0.03 240);
    --fg:oklch(0.96 0.005 240);
    --muted:oklch(0.74 0.014 245);
    --faint:oklch(0.60 0.02 245);
    --line:oklch(0.36 0.02 250);
    --accent:oklch(0.68 0.09 235);
    --font-display:"Saira Condensed","Oswald","Arial Narrow",sans-serif;
    --font-body:"Hanken Grotesk",-apple-system,"Segoe UI",sans-serif;
    --ease-out:cubic-bezier(0.22,1,0.36,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:clamp(14px,4vw,32px)}
  .frame{position:relative;width:min(1120px,100%);aspect-ratio:16/9;container-type:inline-size;
    font-size:1cqw;background:var(--bg);overflow:hidden;box-shadow:0 22px 70px oklch(0.10 0.02 250 / 0.6)}
  .frame-bg{position:absolute;inset:0;
    background:radial-gradient(62% 72% at 50% 46%, var(--raised) 0%, var(--bg) 64%)}
  .frame::before{content:"";position:absolute;inset:3.2cqw;border:1px solid var(--line);pointer-events:none;z-index:4}

  .sweep{position:absolute;top:0;bottom:0;width:36cqw;z-index:2;pointer-events:none;
    background:linear-gradient(90deg, transparent, oklch(0.82 0.08 235 / 0.16) 40%, oklch(0.9 0.05 235 / 0.26) 50%, oklch(0.82 0.08 235 / 0.16) 60%, transparent);
    transform:translateX(-140cqw);
    animation:sweep 1.1s var(--ease-out) .1s both}
  @keyframes sweep{to{transform:translateX(180cqw)}}

  .inner{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 6cqw;text-align:center}

  .mark{width:clamp(30px,9cqw,120px);height:clamp(30px,9cqw,120px);margin-bottom:2.4cqw}
  .mark path,.mark circle{stroke:var(--accent)}
  .mark path{fill:none;stroke-width:clamp(3px,.62cqw,7px);stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:120;stroke-dashoffset:120;animation:draw .55s var(--ease-out) .2s both}
  .mark circle{fill:var(--accent);opacity:0;animation:dot .3s var(--ease-out) .68s both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dot{to{opacity:1}}

  .wordmark{font-family:var(--font-display);font-weight:700;color:var(--fg);line-height:.92;
    text-transform:uppercase;overflow:hidden}
  .l1{font-size:clamp(30px,13cqw,150px);letter-spacing:.03em}
  .l2{font-size:clamp(13px,5.1cqw,58px);letter-spacing:.42em;padding-left:.42em;color:var(--muted);margin-top:1.4cqw}
  .wordmark span{display:inline-block;transform:translateY(1.1em);opacity:0;
    animation:rise .45s var(--ease-out) both}
  .l1 span{animation-delay:calc(.35s + var(--i) * .035s)}
  .l2 span{animation-delay:calc(.72s + var(--i) * .022s)}
  @keyframes rise{to{transform:translateY(0);opacity:1}}

  .underline{width:min(30cqw,46%);height:clamp(2px,.4cqw,5px);background:var(--accent);margin-top:3cqw;
    transform:scaleX(0);transform-origin:50% 50%;animation:ul .5s var(--ease-out) 1s both}
  @keyframes ul{to{transform:scaleX(1)}}

  .tagline{margin-top:3cqw;font-family:var(--font-body);font-size:clamp(12px,1.9cqw,28px);color:var(--muted);
    opacity:0;transform:translateY(.7em);animation:rise .45s var(--ease-out) 1.15s both}
  .meta{display:flex;align-items:center;justify-content:center;gap:1.4cqw;flex-wrap:wrap;margin-top:2.6cqw;
    font-family:var(--font-display);font-size:clamp(9px,1.35cqw,19px);font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--faint);opacity:0;transform:translateY(.6em);
    animation:rise .45s var(--ease-out) 1.32s both}
  .meta .dot{width:.5em;height:.5em;background:var(--accent);border-radius:50%}

  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .page-meta{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .replay{font:inherit;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--line);padding:9px 16px;cursor:pointer}
  .replay:hover{border-color:var(--fg)}
  .visit{color:var(--faint);text-decoration:none;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  .visit:hover{color:var(--fg)}

  @media (prefers-reduced-motion:reduce){
    .sweep{display:none}
    .mark path{stroke-dashoffset:0;animation:none}
    .mark circle{opacity:1;animation:none}
    .wordmark span,.tagline,.meta{transform:none;opacity:1;animation:none}
    .underline{transform:scaleX(1);animation:none}
  }
  .replaying .sweep,.replaying .mark path,.replaying .mark circle,
  .replaying .wordmark span,.replaying .underline,.replaying .tagline,.replaying .meta{animation:none}
</style>
</head>
<body>
<main class="wrap">
  <section class="frame" aria-label="Rinkside Brew House brand intro reveal">
    <div class="frame-bg" aria-hidden="true"></div>
    <div class="sweep" aria-hidden="true"></div>
    <div class="inner">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M54 14 L26 14 A12 12 0 0 0 14 26 L14 54"/>
        <circle cx="32.5" cy="32.5" r="3.6"/>
      </svg>
      <h1 class="wordmark">
        <span class="l1" data-text="RINKSIDE"></span>
        <span class="l2" data-text="BREW HOUSE"></span>
      </h1>
      <div class="underline" aria-hidden="true"></div>
      <p class="tagline">Rinkside in Summerlin</p>
      <div class="meta"><span>Las Vegas, NV</span><span class="dot" aria-hidden="true"></span><span>City National Arena</span></div>
    </div>
  </section>
  <div class="row">
    <span class="page-meta">Rinkside Brew House &middot; brand intro</span>
    <button class="replay" type="button">Replay</button>
    <a class="visit" href="./index.html">Visit the site</a>
  </div>
</main>
<script>
(function(){
  document.querySelectorAll('.wordmark [data-text]').forEach(function(line){
    var t = line.getAttribute('data-text'); line.textContent = '';
    var i = 0;
    t.split('').forEach(function(ch){
      var s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.setProperty('--i', i++);
      line.appendChild(s);
    });
  });
  var frame = document.querySelector('.frame');
  var btn = document.querySelector('.replay');
  if(btn && frame){
    btn.addEventListener('click', function(){
      frame.classList.add('replaying'); void frame.offsetWidth; frame.classList.remove('replaying');
    });
  }
})();
</script>
</body>
</html>
