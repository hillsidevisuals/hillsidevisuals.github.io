<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taco Boom, brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Taco Boom brand intro, built on the Bold Poster motion recipe:
   * a rule draws across, a giant tilted display drops in, a lockup rises
   * line by line, a standfirst fades, a footer rule and metadata draw in.
   * Reskinned end to end to the street screen print system in BRAND-NOTES.md.
   * Palette used, nothing else: ink #1C130D, cream #FFF7EA,
   * chili text safe #B8300F, chili bright (graphics only) #E5401C,
   * mustard #FFC42E.
   */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#1C130D; }
  img,svg{ display:block; }
  h1,p{ margin:0; }
  button{ font:inherit; }

  :root{
    --ink:#1C130D;
    --cream:#FFF7EA;
    --chili-safe:#B8300F;
    --chili-bright:#E5401C;
    --mustard:#FFC42E;
    --font-display:'Bungee','Arial Black',sans-serif;
    --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  }

  body{ font-family:var(--font-body); }

  /* the responsive frame: every inner size is clamp(min, Ncqw, max), so the
     composition scales fluidly with its own container width instead of a
     fixed viewport, and never drops below a legible floor at narrow widths */
  .frame{
    container-type:inline-size;
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:var(--ink);
  }

  .halftone{ position:absolute; inset:0; opacity:0.14; pointer-events:none; }

  .stage{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:clamp(16px,5cqw,68px) clamp(16px,6cqw,92px);
  }

  /* ===== top row: eyebrow + chili rule drawing across ===== */
  .top-row{ display:flex; align-items:center; gap:clamp(10px,1.8cqw,26px); position:relative; z-index:2; }
  .eyebrow{
    font-family:var(--font-body); font-weight:800;
    font-size:clamp(10px,1.5cqw,19px); letter-spacing:0.08em; text-transform:uppercase;
    color:var(--cream); opacity:0.82; white-space:nowrap;
    opacity:0; animation:fadeIn 0.4s ease-out 0.25s both;
  }
  .rule{
    flex:1; height:clamp(2px,0.32cqw,5px); background:var(--chili-bright);
    transform-origin:left center; transform:scaleX(0);
    animation:ruleX 0.6s cubic-bezier(.16,1,.3,1) 0.35s both;
  }
  @keyframes ruleX{ to{ transform:scaleX(1); } }
  @keyframes fadeIn{ to{ opacity:0.82; } }

  /* ===== wordmark stage, centered in the remaining space ===== */
  .wordmark-area{
    flex:1; position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .wm-taco{
    font-family:var(--font-display); font-size:clamp(13px,2.6cqw,32px);
    letter-spacing:0.14em; text-transform:uppercase;
    color:transparent; -webkit-text-stroke:1.4px var(--cream);
    margin-bottom:clamp(4px,0.7cqw,10px);
    opacity:0; transform:translateY(0.8em);
    animation:riseIn 0.45s cubic-bezier(.16,1,.3,1) 1.05s both;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  .wm-boom-wrap{
    position:relative; display:inline-block;
    font-family:var(--font-display); font-size:clamp(58px,15cqw,192px);
    letter-spacing:-0.03em; text-transform:uppercase;
  }
  .wm-boom{
    position:relative; z-index:1; display:inline-block;
    color:var(--mustard);
    text-shadow:
      clamp(2px,0.32cqw,6px) clamp(2px,0.32cqw,6px) 0 var(--chili-safe),
      clamp(4px,0.64cqw,12px) clamp(4px,0.64cqw,12px) 0 var(--ink);
    opacity:0;
    transform:translateY(-1.1em) rotate(-9deg) scale(0.88);
    animation:boomDrop 0.6s cubic-bezier(.2,1.4,.35,1) 0.55s both;
  }
  @keyframes boomDrop{
    0%   { opacity:0; transform:translateY(-1.1em) rotate(-9deg) scale(0.88); }
    68%  { opacity:1; transform:translateY(0.04em) rotate(3deg) scale(1.04); }
    100% { opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
  }

  /* comic burst, detonates once behind the wordmark then settles tucked in,
     mustard fill, the accent moment */
  .wm-burst{
    position:absolute; top:50%; left:50%; z-index:0;
    width:1em; height:1em;
    fill:var(--mustard);
    opacity:0;
    transform:translate(-50%,-50%) scale(0.15) rotate(-34deg);
    animation:burstDetonate 0.65s cubic-bezier(.18,1,.32,1) 0.55s both;
  }
  @keyframes burstDetonate{
    0%   { opacity:0;   transform:translate(-50%,-50%) scale(0.15) rotate(-34deg); }
    42%  { opacity:1;   transform:translate(-50%,-50%) scale(1.35) rotate(10deg); }
    100% { opacity:1;   transform:translate(-50%,-50%) scale(0.82) rotate(4deg); }
  }

  .tagline{
    margin-top:clamp(10px,1.6cqw,26px);
    font-family:var(--font-body); font-weight:800;
    font-size:clamp(14px,2.2cqw,29px); color:var(--cream);
    opacity:0; transform:translateY(0.6em);
    animation:fadeUp 0.5s ease-out 1.35s both;
  }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  /* ===== footer: neutral rule + meta line ===== */
  /* footer, meta and controls share one flex row so they reflow together
     and can never overlap, even at very short (wide-and-flat or narrow)
     aspect ratios; controls wrap under the meta line if the row runs out
     of room rather than floating independently over anything else */
  .footer{ position:relative; z-index:2; }
  .footer-rule{
    height:clamp(1px,0.16cqw,2px); background:var(--cream); opacity:0;
    transform-origin:left center; transform:scaleX(0);
    animation:footerRuleX 0.5s cubic-bezier(.16,1,.3,1) 1.70s both;
  }
  @keyframes footerRuleX{ to{ opacity:0.4; transform:scaleX(1); } }
  .footer-bottom-row{
    margin-top:clamp(8px,1.3cqw,18px);
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; row-gap:clamp(6px,1cqw,14px); column-gap:clamp(10px,1.6cqw,24px);
  }
  .footer-meta{
    display:flex; align-items:center;
    gap:clamp(6px,0.9cqw,14px);
    font-family:var(--font-body); font-weight:700;
    font-size:clamp(11px,1.35cqw,19px); letter-spacing:0.04em;
    color:var(--cream); opacity:0;
    animation:fadeIn2 0.45s ease-out 1.95s both;
  }
  @keyframes fadeIn2{ to{ opacity:0.85; } }
  .footer-meta .dot{ color:var(--mustard); }

  /* ===== controls: small, unobtrusive ===== */
  .controls{
    display:flex; align-items:center; gap:clamp(10px,1.4cqw,20px);
    opacity:0; animation:fadeIn3 0.4s ease-out 2.20s both;
  }
  @keyframes fadeIn3{ to{ opacity:1; } }
  .replay-btn{
    display:inline-flex; align-items:center; gap:clamp(4px,0.6cqw,8px);
    background:transparent; border:1px solid rgba(255,247,234,0.35);
    border-radius:999px; cursor:pointer;
    padding:clamp(5px,0.9cqw,10px) clamp(10px,1.6cqw,18px);
    font-family:var(--font-body); font-weight:700;
    font-size:clamp(9px,1.05cqw,14px); letter-spacing:0.06em; text-transform:uppercase;
    color:var(--cream); opacity:0.75;
    transition:opacity .15s ease, border-color .15s ease;
  }
  .replay-btn svg{ width:clamp(8px,1cqw,13px); height:clamp(8px,1cqw,13px); }
  .replay-btn:hover{ opacity:1; border-color:rgba(255,196,46,0.7); }
  .replay-btn:focus-visible{ outline:2px solid var(--mustard); outline-offset:2px; }
  .visit-link{
    font-family:var(--font-body); font-weight:700;
    font-size:clamp(9px,1.05cqw,14px); letter-spacing:0.04em;
    color:var(--mustard); opacity:0.85; text-decoration:none;
    border-bottom:1px solid rgba(255,196,46,0.4);
    transition:opacity .15s ease;
  }
  .visit-link:hover{ opacity:1; }
  .visit-link:focus-visible{ outline:2px solid var(--mustard); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    .eyebrow,.rule,.wm-boom,.wm-burst,.wm-taco,.tagline,.footer-rule,.footer-meta,.controls{
      animation:none !important;
    }
    .eyebrow{ opacity:0.82; }
    .rule{ transform:scaleX(1); }
    .wm-boom{ opacity:1; transform:none; }
    .wm-burst{ opacity:1; transform:translate(-50%,-50%) scale(0.82) rotate(4deg); }
    .wm-taco{ opacity:1; transform:none; }
    .tagline{ opacity:1; transform:none; }
    .footer-rule{ opacity:0.4; transform:scaleX(1); }
    .footer-meta{ opacity:0.85; }
    .controls{ opacity:1; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="boom-burst" viewBox="0 0 200 200">
      <path d="M 100.0,8.0 L 120.7,50.1 L 162.2,37.8 L 153.6,77.8 L 196.0,100.0 L 148.0,119.9 L 159.4,159.4 L 123.0,155.4 L 100.0,190.0 L 79.0,150.8 L 34.2,165.8 L 47.3,121.8 L 14.0,100.0 L 43.6,76.7 L 35.7,35.7 L 79.7,51.0 Z"/>
    </symbol>
    <pattern id="halftone-mustard" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#FFC42E"/>
    </pattern>
  </defs>
</svg>

<div class="frame" id="frame" data-od-id="brand-intro-frame">
  <svg class="halftone" viewBox="0 0 400 400" preserveAspectRatio="none"><rect width="400" height="400" fill="url(#halftone-mustard)"/></svg>

  <div class="stage">
    <div class="top-row">
      <span class="eyebrow anim-el">Las Vegas Street Tacos</span>
      <span class="rule anim-el"></span>
    </div>

    <div class="wordmark-area">
      <span class="wm-taco anim-el">Taco</span>
      <span class="wm-boom-wrap" data-od-id="brand-intro-wordmark">
        <svg class="wm-burst anim-el" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
        <span class="wm-boom anim-el">Boom</span>
      </span>
      <p class="tagline anim-el" data-od-id="brand-intro-tagline">Fast tacos, big flavor.</p>
    </div>

    <div class="footer">
      <div class="footer-rule anim-el"></div>
      <div class="footer-bottom-row">
        <div class="footer-meta anim-el">
          <span>Las Vegas</span>
          <span class="dot">&middot;</span>
          <span>@tacoboomlv</span>
        </div>
        <div class="controls anim-el">
          <button class="replay-btn" id="replayBtn" type="button" aria-label="Replay the intro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            Replay
          </button>
          <a class="visit-link" href="./">Visit the site</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    var frame = document.getElementById('frame');
    var replayBtn = document.getElementById('replayBtn');
    replayBtn.addEventListener('click', function(){
      var animated = frame.querySelectorAll('.anim-el');
      animated.forEach(function(el){ el.style.animation = 'none'; });
      void frame.offsetWidth;
      animated.forEach(function(el){ el.style.animation = ''; });
    });
  })();
</script>

</body>
</html>
