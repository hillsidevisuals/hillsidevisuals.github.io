<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taco Boom, brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
   * Taco Boom brand intro — reskinned onto the Phase-A screen-print system
   * (brand/DESIGN.md + brand/variables.css). The motion is unchanged: a
   * marigold rule sweeps across, the hand-cut burst detonates once behind the
   * wordmark, the tilted BOOM drops in with its turquoise misregistration
   * offset, the lockup and footer rise line by line, then it holds.
   *
   * fingerprint self-critique: P4 H4 E4 S5 R4 V4
   *   Philosophy 4  — a printed flyer detonating, not a generic logo sting
   *   Hierarchy 4   — one word owns the frame, everything else small and quiet
   *   Execution 4   — OKLCH tokens only, container-query fluid, holds final frame
   *   Specificity 5 — real slogan, real handle, real city, the Phase-A burst path
   *   Restraint 4   — one working accent (marigold), turquoise is the print plate
   *   Variety 4     — poster / bold-poster motion, shares 0 axes with siblings
   *
   * Note: the .wm-boom text-shadow is a HARD offset (zero blur, two crisp
   * steps) — the screen-print misregistration of the two poster inks that the
   * whole brand is built on, not a soft glow.
   */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  img,svg{ display:block; }
  h1,p{ margin:0; }
  button{ font:inherit; }

  :root{
    --bg:            oklch(0.40 0.058 45);   /* masa-brown paper */
    --bg-deep:       oklch(0.33 0.05 42);    /* deep ground, depth step */
    --fg:            oklch(0.96 0.018 85);   /* tortilla-cream text */
    --muted:         oklch(0.85 0.032 80);   /* secondary text (AA on --bg) */
    --border:        oklch(0.55 0.045 46);   /* hairline */
    --accent:        oklch(0.81 0.155 79);   /* marigold, the one working accent */
    --pop:           oklch(0.77 0.10 196);   /* turquoise, misregistration plate only */
    --font-display:  "Anton","Arial Narrow","Oswald",sans-serif;
    --font-body:     "Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --ease-out:      cubic-bezier(0.2,0.7,0.3,1);
  }

  body{ font-family:var(--font-body); display:flex; align-items:center; justify-content:center; min-height:100vh; }

  /* responsive frame: every inner size is clamp(min, Ncqw, max), so the
     composition scales fluidly with its own container width and never drops
     below a legible floor at narrow widths */
  .frame{
    container-type:inline-size;
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:var(--bg);
  }
  /* narrow screens: the 16/9 box is too short to hold the lockup, so the
     frame goes square, then portrait, the shapes it is posted at anyway */
  @media (max-width:760px){ .frame{ aspect-ratio:1/1; } }
  @media (max-width:430px){ .frame{ aspect-ratio:4/5; } }

  .halftone{ position:absolute; inset:0; opacity:0.12; pointer-events:none; }

  .stage{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:clamp(16px,5cqw,68px) clamp(16px,6cqw,92px);
  }

  /* ===== top row: label + marigold rule drawing across ===== */
  .top-row{ display:flex; align-items:center; gap:clamp(10px,1.8cqw,26px); position:relative; z-index:2; }
  .eyebrow{
    font-family:var(--font-body); font-weight:700;
    font-size:clamp(10px,1.5cqw,19px); letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted); white-space:nowrap;
    opacity:0; animation:fadeIn 0.4s var(--ease-out) 0.25s both;
  }
  .rule{
    flex:1; height:clamp(2px,0.32cqw,5px); background:var(--accent);
    transform-origin:left center; transform:scaleX(0);
    animation:ruleX 0.6s cubic-bezier(.16,1,.3,1) 0.35s both;
  }
  @keyframes ruleX{ to{ transform:scaleX(1); } }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ===== wordmark stage, centered in the remaining space ===== */
  .wordmark-area{
    flex:1; position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .wm-taco{
    font-family:var(--font-display); font-size:clamp(15px,3cqw,34px);
    letter-spacing:0.14em; text-transform:uppercase;
    color:transparent; -webkit-text-stroke:1.4px var(--fg);
    margin-bottom:clamp(8px,1.4cqw,20px);
    opacity:0; transform:translateY(0.8em);
    animation:riseIn 0.45s cubic-bezier(.16,1,.3,1) 1.05s both;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  .wm-boom-wrap{
    position:relative; display:block;
    font-family:var(--font-display); font-size:clamp(62px,17cqw,196px);
    letter-spacing:-0.03em; text-transform:uppercase; line-height:0.82;
  }
  .wm-boom{
    position:relative; z-index:1; display:inline-block; line-height:0.82;
    color:var(--accent);
    text-shadow:
      clamp(2px,0.34cqw,7px) clamp(2px,0.34cqw,7px) 0 var(--pop),
      clamp(4px,0.68cqw,14px) clamp(4px,0.68cqw,14px) 0 var(--bg-deep);
    opacity:0;
    transform:translateY(-1.1em) rotate(-9deg) scale(0.88);
    animation:boomDrop 0.6s cubic-bezier(.2,1.4,.35,1) 0.55s both;
  }
  @keyframes boomDrop{
    0%   { opacity:0; transform:translateY(-1.1em) rotate(-9deg) scale(0.88); }
    68%  { opacity:1; transform:translateY(0.04em) rotate(3deg) scale(1.04); }
    100% { opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
  }

  /* hand-cut burst = the Phase-A logo mark, animated: it detonates once behind
     the wordmark then settles tucked in. Marigold face + turquoise offset copy. */
  .wm-burst{
    position:absolute; top:50%; left:50%; z-index:0;
    width:1.15em; height:1.15em;
    opacity:0;
    transform:translate(-50%,-50%) scale(0.15) rotate(-34deg);
    animation:burstDetonate 0.65s cubic-bezier(.18,1,.32,1) 0.55s both;
  }
  .wm-burst .b{ fill:var(--pop); }
  .wm-burst .a{ fill:var(--accent); }
  @keyframes burstDetonate{
    0%   { opacity:0;   transform:translate(-50%,-50%) scale(0.15) rotate(-34deg); }
    42%  { opacity:1;   transform:translate(-50%,-50%) scale(1.35) rotate(10deg); }
    100% { opacity:0.30;transform:translate(-58%,-60%) scale(0.46) rotate(6deg); }
  }

  .tagline{
    margin-top:clamp(10px,1.6cqw,26px);
    font-family:var(--font-body); font-weight:700;
    font-size:clamp(14px,2.4cqw,29px); color:var(--fg);
    opacity:0; transform:translateY(0.6em);
    animation:fadeUp 0.5s var(--ease-out) 1.35s both;
  }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  /* ===== footer: neutral rule + meta line + controls, one reflowing row ===== */
  .footer{ position:relative; z-index:2; }
  .footer-rule{
    height:clamp(1px,0.16cqw,2px); background:var(--border); opacity:0;
    transform-origin:left center; transform:scaleX(0);
    animation:footerRuleX 0.5s cubic-bezier(.16,1,.3,1) 1.70s both;
  }
  @keyframes footerRuleX{ to{ opacity:1; transform:scaleX(1); } }
  .footer-bottom-row{
    margin-top:clamp(8px,1.3cqw,18px);
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; row-gap:clamp(6px,1cqw,14px); column-gap:clamp(10px,1.6cqw,24px);
  }
  .footer-meta{
    display:flex; align-items:center;
    gap:clamp(6px,0.9cqw,14px);
    font-family:var(--font-body); font-weight:600;
    font-size:clamp(11px,1.5cqw,19px); letter-spacing:0.04em;
    color:var(--muted); opacity:0;
    animation:fadeIn 0.45s var(--ease-out) 1.95s both;
  }
  .footer-meta .dot{ color:var(--accent); }

  /* ===== controls: small, unobtrusive ===== */
  .controls{
    display:flex; align-items:center; gap:clamp(10px,1.4cqw,20px);
    opacity:0; animation:fadeIn 0.4s var(--ease-out) 2.20s both;
  }
  .replay-btn{
    display:inline-flex; align-items:center; gap:clamp(4px,0.6cqw,8px);
    background:transparent; border:1px solid var(--border);
    border-radius:999px; cursor:pointer;
    padding:clamp(5px,0.9cqw,10px) clamp(10px,1.6cqw,18px);
    font-family:var(--font-body); font-weight:600;
    font-size:clamp(9px,1.15cqw,14px); letter-spacing:0.06em; text-transform:uppercase;
    color:var(--fg);
    transition:border-color .15s ease, color .15s ease;
  }
  .replay-btn svg{ width:clamp(8px,1cqw,13px); height:clamp(8px,1cqw,13px); }
  .replay-btn:hover{ border-color:var(--accent); }
  .replay-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .visit-link{
    font-family:var(--font-body); font-weight:600;
    font-size:clamp(9px,1.15cqw,14px); letter-spacing:0.04em;
    color:var(--fg); text-decoration:none;
    border-bottom:1px solid var(--accent);
    transition:color .15s ease;
  }
  .visit-link:hover{ color:var(--accent); }
  .visit-link:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* still frame: #still drops every animation onto its final resting state so
     the last lockup can be captured or held */
  .frame.still .eyebrow{ animation:none!important; opacity:1; }
  .frame.still .rule{ animation:none!important; transform:scaleX(1); }
  .frame.still .wm-boom{ animation:none!important; opacity:1; transform:none; }
  .frame.still .wm-burst{ animation:none!important; opacity:0.30; transform:translate(-58%,-60%) scale(0.46) rotate(6deg); }
  .frame.still .wm-taco{ animation:none!important; opacity:1; transform:none; }
  .frame.still .tagline{ animation:none!important; opacity:1; transform:none; }
  .frame.still .footer-rule{ animation:none!important; opacity:1; transform:scaleX(1); }
  .frame.still .footer-meta{ animation:none!important; opacity:1; }
  .frame.still .controls{ animation:none!important; opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .eyebrow,.rule,.wm-boom,.wm-burst,.wm-taco,.tagline,.footer-rule,.footer-meta,.controls{
      animation:none !important;
    }
    .eyebrow{ opacity:1; }
    .rule{ transform:scaleX(1); }
    .wm-boom{ opacity:1; transform:none; }
    .wm-burst{ opacity:0.30; transform:translate(-58%,-60%) scale(0.46) rotate(6deg); }
    .wm-taco{ opacity:1; transform:none; }
    .tagline{ opacity:1; transform:none; }
    .footer-rule{ opacity:1; transform:scaleX(1); }
    .footer-meta{ opacity:1; }
    .controls{ opacity:1; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Phase-A hand-cut burst (brand/logos/logo-mark.svg), ~28 uneven points -->
    <path id="tb-burst" d="M50.00,4.00 L54.23,31.48 L69.09,10.36 L63.72,32.80 L86.75,20.70 L66.22,42.19 L91.92,40.43 L71.00,50.00 L93.87,60.01 L68.02,58.68 L85.96,78.68 L61.85,64.85 L69.09,89.64 L55.12,72.42 L50.00,97.00 L45.99,67.55 L31.34,88.74 L36.91,66.42 L14.04,78.68 L32.88,58.24 L6.13,60.01 L28.00,50.00 L7.10,40.21 L31.98,41.32 L13.25,20.70 L38.78,35.93 L30.48,9.46 L45.33,29.53 Z"/>
    <pattern id="halftone-marigold" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="oklch(0.81 0.155 79)"/>
    </pattern>
  </defs>
</svg>

<div class="frame" id="frame">
  <svg class="halftone" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true"><rect width="400" height="400" fill="url(#halftone-marigold)"/></svg>

  <div class="stage">
    <div class="top-row">
      <span class="eyebrow anim-el">Las Vegas street tacos</span>
      <span class="rule anim-el"></span>
    </div>

    <div class="wordmark-area">
      <span class="wm-taco anim-el">Taco</span>
      <span class="wm-boom-wrap">
        <svg class="wm-burst anim-el" viewBox="0 0 100 100" aria-hidden="true">
          <use href="#tb-burst" x="5" y="5" class="b"/>
          <use href="#tb-burst" class="a"/>
        </svg>
        <span class="wm-boom">Boom</span>
      </span>
      <p class="tagline anim-el">Fast tacos, big flavor.</p>
    </div>

    <div class="footer">
      <div class="footer-rule anim-el"></div>
      <div class="footer-bottom-row">
        <div class="footer-meta anim-el">
          <span>Las Vegas, NV</span>
          <span class="dot">&middot;</span>
          <span>@tacoboomlv</span>
        </div>
        <div class="controls anim-el">
          <button class="replay-btn" id="replayBtn" type="button" aria-label="Replay the intro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            Replay
          </button>
          <a class="visit-link" href="./">Visit the site</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    var frame = document.getElementById('frame');
    var replayBtn = document.getElementById('replayBtn');
    function applyStill(){
      if(location.hash === '#still') frame.classList.add('still');
      else frame.classList.remove('still');
    }
    applyStill();
    window.addEventListener('hashchange', applyStill);
    replayBtn.addEventListener('click', function(){
      frame.classList.remove('still');
      if(location.hash === '#still'){ history.replaceState(null,'',location.pathname); }
      var animated = frame.querySelectorAll('.anim-el');
      animated.forEach(function(el){ el.style.animation = 'none'; });
      void frame.offsetWidth;
      animated.forEach(function(el){ el.style.animation = ''; });
    });
  })();
</script>

</body>
</html>
