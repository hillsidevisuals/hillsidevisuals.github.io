<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Taco Boom, brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#000; }
  img,svg{ display:block; }
  h1,p{ margin:0; }

  :root{
    /* exact tokens from BRAND-NOTES.md */
    --ink:#1C130D;
    --ink-soft:#2A1D14;
    --cream:#FFF7EA;
    --cream-muted:#C9BCA9;
    --chili-deep:#B8300F;
    --mustard:#FFC42E;

    --font-display:'Bungee','Arial Black',sans-serif;
    --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  }

  .stage-outer{ display:flex; align-items:center; justify-content:center; background:#000; }

  /* fixed 16:9 stage. HyperFrames sets its own render viewport to the
     configured export resolution at video time; 1440x810 here is simply an
     exact 16:9 reference canvas, sized to match this environment's preview
     viewport 1:1 so static QA frames render with no crop or scale guessing. */
  .stage{
    position:relative;
    width:1440px; height:810px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 46%, var(--ink-soft) 0%, var(--ink) 62%);
  }

  .top-ribbon{ position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg, var(--mustard), var(--chili-deep)); }

  .halftone{ position:absolute; inset:0; opacity:0.16; pointer-events:none; }

  .content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; }

  /* ===== burst shards, detonate outward once then fade ===== */
  .shard-field{ position:absolute; top:50%; left:50%; width:0; height:0; z-index:1; }
  .shard{ position:absolute; top:0; left:0; width:90px; height:90px; margin:-45px 0 0 -45px; transform-origin:50% 50%; animation: shardBurst 0.5s cubic-bezier(.22,.7,.3,1) both; }
  @keyframes shardBurst{
    0%   { opacity:0;   transform:scale(0.35) translate(0,0); }
    38%  { opacity:0.9; transform:scale(1.05) translate(var(--dx), var(--dy)); }
    100% { opacity:0;   transform:scale(1.2) translate(calc(var(--dx) * 1.5), calc(var(--dy) * 1.5)); }
  }
  .shard:nth-child(1){ --dx:-158px; --dy:-98px;  animation-delay:.30s; }
  .shard:nth-child(2){ --dx:165px;  --dy:-113px; animation-delay:.33s; }
  .shard:nth-child(3){ --dx:-195px; --dy:83px;   animation-delay:.36s; }
  .shard:nth-child(4){ --dx:188px;  --dy:105px;  animation-delay:.39s; }
  .shard:nth-child(5){ --dx:0px;    --dy:-173px; animation-delay:.42s; }
  .shard:nth-child(6){ --dx:0px;    --dy:165px;  animation-delay:.45s; }
  .shard-1{ fill:var(--mustard); }
  .shard-2{ fill:var(--chili-deep); }

  /* ===== glow bloom behind the wordmark ===== */
  .glow{
    position:absolute; top:50%; left:50%; width:615px; height:615px; margin:-308px 0 0 -308px;
    border-radius:50%; z-index:1; pointer-events:none;
    background:radial-gradient(circle, rgba(255,196,46,0.55) 0%, rgba(255,196,46,0.16) 42%, rgba(255,196,46,0) 72%);
    filter:blur(5px);
    opacity:0;
    animation: glowBloom 0.9s ease-out .42s both;
  }
  @keyframes glowBloom{
    0%   { opacity:0; }
    45%  { opacity:1; }
    100% { opacity:0.4; }
  }

  /* ===== wordmark, exact offset print construction from BRAND-NOTES.md ===== */
  .wordmark-pop{
    position:relative; z-index:2;
    display:inline-flex; flex-direction:column; align-items:center; line-height:0.86;
    opacity:0;
    animation: wordmarkPop 0.42s cubic-bezier(.2,1.55,.4,1) .42s both;
  }
  @keyframes wordmarkPop{
    0%   { opacity:0; transform:scale(0.55) rotate(-4deg); }
    62%  { opacity:1; transform:scale(1.07) rotate(1deg); }
    100% { opacity:1; transform:scale(1) rotate(0deg); }
  }
  .wm-taco{ font-family:var(--font-display); font-size:28px; letter-spacing:0.14em; text-transform:uppercase; color:transparent; -webkit-text-stroke:1.3px var(--cream); margin-bottom:8px; }
  .wm-boom-wrap{ position:relative; display:inline-block; font-family:var(--font-display); font-size:164px; letter-spacing:-0.03em; text-transform:uppercase; overflow:visible; }
  .wm-burst{ position:absolute; top:50%; left:50%; width:1.3em; height:1.3em; transform:translate(-50%,-50%) rotate(4deg); fill:var(--chili-deep); z-index:0; }
  .wm-boom{ position:relative; z-index:1; color:var(--mustard); text-shadow:5px 5px 0 var(--chili-deep), 10px 10px 0 var(--ink); }

  /* light sweep overlay, purely additive, never touches the text's own color */
  .sweep-mask{ position:absolute; inset:-10% -6%; overflow:hidden; pointer-events:none; z-index:3; }
  .sweep-bar{
    position:absolute; top:0; bottom:0; left:-35%; width:22%;
    background:linear-gradient(100deg, transparent 0%, rgba(255,247,234,0.55) 50%, transparent 100%);
    transform:translateX(-40%) skewX(-18deg);
    animation: sweepMove 0.75s ease-out .90s 1 both;
  }
  @keyframes sweepMove{
    0%   { transform:translateX(-40%) skewX(-18deg); opacity:0; }
    12%  { opacity:1; }
    100% { transform:translateX(560%) skewX(-18deg); opacity:0; }
  }

  /* ===== tagline chip, same component language as the site's hero quote ===== */
  .tagline-reveal{
    margin-top:34px;
    opacity:0; transform:translateY(14px);
    animation: fadeUp 0.5s ease-out 1.05s both;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  .tagline-chip{
    display:inline-block; padding:11px 22px;
    background:var(--ink-soft); border:1.5px solid rgba(255,196,46,0.4); border-radius:999px;
    font-family:var(--font-body); font-weight:800; font-size:23px; letter-spacing:0.005em; color:var(--mustard);
  }

  /* ===== meta row ===== */
  .meta-reveal{
    position:absolute; left:48px; right:48px; bottom:38px; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    opacity:0; transform:translateY(11px);
    animation: fadeUp 0.5s ease-out 1.40s both;
  }
  .meta-item{ font-family:var(--font-body); font-weight:800; font-size:14px; letter-spacing:0.1em; text-transform:uppercase; }
  .meta-left{ color:var(--cream-muted); }
  .meta-right{ color:var(--mustard); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="boom-burst" viewBox="0 0 200 200">
      <path d="M 100.0,8.0 L 120.7,50.1 L 162.2,37.8 L 153.6,77.8 L 196.0,100.0 L 148.0,119.9 L 159.4,159.4 L 123.0,155.4 L 100.0,190.0 L 79.0,150.8 L 34.2,165.8 L 47.3,121.8 L 14.0,100.0 L 43.6,76.7 L 35.7,35.7 L 79.7,51.0 Z"/>
    </symbol>
    <pattern id="halftone-mustard" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#FFC42E"/>
    </pattern>
  </defs>
</svg>

<div class="stage-outer">
<div class="stage" data-od-id="brand-intro-stage">
  <div class="top-ribbon"></div>
  <svg class="halftone" viewBox="0 0 400 400" preserveAspectRatio="none"><rect width="400" height="400" fill="url(#halftone-mustard)"/></svg>

  <div class="shard-field" aria-hidden="true">
    <svg class="shard shard-1" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
    <svg class="shard shard-2" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
    <svg class="shard shard-1" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
    <svg class="shard shard-2" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
    <svg class="shard shard-1" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
    <svg class="shard shard-2" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
  </div>

  <div class="glow" aria-hidden="true"></div>

  <div class="content">
    <div class="wordmark-pop" data-od-id="brand-intro-wordmark">
      <span class="wm-taco">Taco</span>
      <span class="wm-boom-wrap">
        <svg class="wm-burst" viewBox="0 0 200 200"><use href="#boom-burst"/></svg>
        <span class="wm-boom">Boom</span>
        <span class="sweep-mask"><span class="sweep-bar"></span></span>
      </span>
    </div>

    <div class="tagline-reveal" data-od-id="brand-intro-tagline">
      <span class="tagline-chip">&ldquo;Fast tacos, big flavor.&rdquo;</span>
    </div>
  </div>

  <div class="meta-reveal">
    <span class="meta-item meta-left">Las Vegas Street Tacos</span>
    <span class="meta-item meta-right">@tacoboomlv</span>
  </div>
</div>
</div>

</body>
</html>
