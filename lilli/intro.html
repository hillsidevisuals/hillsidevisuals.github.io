<!DOCTYPE html>
<!--
  Lilli — brand intro. Bespoke, template-bespoke (electric-studio feel).
  A gold hairline traces a circle, the black badge resolves inside it, the script
  wordmark fades up centred, a gold rule draws, tagline and locality follow.
  Final lockup held (no fade to black). Fluid 16:9 stage in cqw, portrait on phones.
  Lilli's brand only. Every colour an OKLCH token. P5 H4 E5 S4 R5 V4
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lilli | Brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter+Tight:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:oklch(0.21 0.012 66);
    --disc:oklch(0.16 0.012 66);
    --raised:color-mix(in oklch, oklch(0.63 0.072 74) 15%, oklch(0.21 0.012 66));
    --ivory:oklch(0.94 0.012 84);
    --muted:color-mix(in oklch, oklch(0.94 0.012 84) 74%, transparent);
    --faint:color-mix(in oklch, oklch(0.94 0.012 84) 64%, transparent);
    --line:color-mix(in oklch, oklch(0.94 0.012 84) 16%, transparent);
    --accent:oklch(0.70 0.080 77);
    --font-display:"Bodoni Moda",Georgia,serif;
    --font-body:"Inter Tight",-apple-system,sans-serif;
    --font-script:"Pinyon Script",cursive;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--ivory);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:clamp(14px,4vw,32px)}
  .frame{position:relative;width:min(1120px,100%);aspect-ratio:16/9;container-type:inline-size;
    font-size:1cqw;background:var(--bg);overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.5)}
  .frame-bg{position:absolute;inset:0;background:radial-gradient(58% 68% at 50% 44%,var(--raised) 0%,var(--bg) 64%)}
  .frame::before{content:"";position:absolute;inset:3.2cqw;border:1px solid var(--line);pointer-events:none;z-index:3}
  .inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 6cqw;text-align:center}

  .badge{position:relative;width:clamp(58px,13cqw,150px);height:clamp(58px,13cqw,150px);
    display:flex;align-items:center;justify-content:center}
  .badge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
  .badge .ring{fill:none;stroke:var(--accent);stroke-width:1.4;
    stroke-dasharray:295;stroke-dashoffset:295;transform:rotate(-90deg);transform-origin:50% 50%;
    animation:trace .8s var(--ease-out) .15s forwards}
  .badge .disc{fill:var(--disc);opacity:0;animation:fill .4s ease .7s forwards}
  .badge .inner-ring{fill:none;stroke:color-mix(in oklch,var(--ivory) 42%,transparent);stroke-width:1;
    opacity:0;animation:fade .4s ease .9s forwards}
  .badge .mono{position:relative;z-index:1;font-family:var(--font-script);
    font-size:clamp(28px,6.6cqw,80px);color:var(--ivory);
    opacity:0;transform:translateY(.3em);animation:rise .5s var(--ease-out) .95s forwards;line-height:1}

  .wordmark{font-family:var(--font-script);font-size:clamp(42px,13cqw,150px);color:var(--ivory);
    line-height:.8;margin-top:3cqw;opacity:0;transform:translateY(.35em);
    animation:rise .6s var(--ease-out) 1.2s forwards}
  .rule{width:min(22cqw,40%);height:1px;background:var(--accent);margin-top:3.2cqw;
    transform:scaleX(0);transform-origin:50% 50%;animation:draw .5s var(--ease-out) 1.55s forwards}
  .tagline{margin-top:2.8cqw;font-family:var(--font-display);font-size:clamp(12px,2cqw,32px);
    color:var(--muted);opacity:0;transform:translateY(.6em);animation:rise .6s var(--ease-out) 1.7s forwards}
  .meta{display:flex;align-items:center;justify-content:center;gap:1.4cqw;flex-wrap:wrap;margin-top:3.6cqw;
    font-size:clamp(9px,1.15cqw,16px);font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);opacity:0;animation:fade .6s ease 2s forwards}

  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .page-meta{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .replay{font:inherit;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ivory);background:transparent;border:1px solid var(--line);padding:9px 16px;cursor:pointer}
  .replay:hover{border-color:var(--ivory)}
  .visit{color:var(--faint);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
  .visit:hover{color:var(--ivory)}

  @keyframes trace{to{stroke-dashoffset:0}}
  @keyframes fill{to{opacity:1}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes draw{to{transform:scaleX(1)}}

  @media (max-width:560px){ .frame{aspect-ratio:3/4} }
  @container (max-width:430px){ .inner{padding:0 5cqw} }

  @media (prefers-reduced-motion:reduce){
    .badge .ring{stroke-dashoffset:0}
    .badge .disc,.badge .inner-ring,.meta{opacity:1;animation:none}
    .badge .mono,.wordmark,.tagline{opacity:1;transform:none;animation:none}
    .rule{transform:scaleX(1);animation:none}
  }
  /* forced final state: JS adds .settled ~3s in so the lockup definitively holds */
  .settled .badge .ring{stroke-dashoffset:0}
  .settled .badge .disc,.settled .badge .inner-ring,.settled .meta{opacity:1;animation:none}
  .settled .badge .mono,.settled .wordmark,.settled .tagline{opacity:1;transform:none;animation:none}
  .settled .rule{transform:scaleX(1);animation:none}
  .replaying .badge .ring,.replaying .badge .disc,.replaying .badge .inner-ring,.replaying .badge .mono,
  .replaying .wordmark,.replaying .rule,.replaying .tagline,.replaying .meta{animation:none}
</style>
</head>
<body>
<main class="wrap">
  <section class="frame" aria-label="Lilli brand intro">
    <div class="frame-bg" aria-hidden="true"></div>
    <div class="inner">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle class="ring" cx="50" cy="50" r="47"/>
          <circle class="disc" cx="50" cy="50" r="46"/>
          <circle class="inner-ring" cx="50" cy="50" r="39"/>
        </svg>
        <span class="mono">L</span>
      </div>
      <h1 class="wordmark">Lilli</h1>
      <div class="rule"></div>
      <p class="tagline">American ingredients, French technique.</p>
      <div class="meta"><span>Chinatown, Las Vegas</span><span>&middot;</span><span>@lilli.vegas</span></div>
    </div>
  </section>
  <div class="row">
    <span class="page-meta">Lilli &middot; brand intro &middot; 6s</span>
    <button class="replay" type="button">Replay</button>
    <a class="visit" href="./">Visit the site</a>
  </div>
</main>
<script>
(function(){
  var frame = document.querySelector('.frame');
  var settle = setTimeout(function(){ if(frame) frame.classList.add('settled'); }, 3200);
  var btn = document.querySelector('.replay');
  if(btn && frame){
    btn.addEventListener('click', function(){
      clearTimeout(settle);
      frame.classList.remove('settled');
      frame.classList.add('replaying');
      void frame.offsetWidth;
      frame.classList.remove('replaying');
      setTimeout(function(){ frame.classList.add('settled'); }, 3200);
    });
  }
})();
</script>
</body>
</html>
