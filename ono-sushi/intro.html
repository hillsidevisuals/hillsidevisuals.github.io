<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ono Sushi — brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<!--
  Ono Sushi brand intro — template-bespoke, MATCHED to the real identity.
  Timeline: charcoal wall -> the "DRINK SAKE STAY SOBA" neon flickers on above -> the "ono" rings
  pop in -> the tomato-red bar draws under them -> the tagline rises. The full lockup holds.
  fingerprint self-critique: P5 H4 E4 S5 R4 V4
-->
<style>
:root{
  --bg:      oklch(0.17 0.006 40);
  --fg:      oklch(0.95 0.008 85);
  --accent:  oklch(0.585 0.19 28);
  --neon:    oklch(0.70 0.215 27);
  --muted:   oklch(0.74 0.012 75);
  --font-display:"Baloo 2","Trebuchet MS",sans-serif;
  --font-body:"IBM Plex Sans",-apple-system,sans-serif;
  --ease-out:cubic-bezier(0.2,0.7,0.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden}
.stage{
  position:relative;width:100%;height:100%;
  container-type:size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6cqmin;padding:6cqmin;
  background:radial-gradient(130% 90% at 50% 30%, oklch(0.23 0.012 45) 0%, var(--bg) 62%);
}
/* neon sign, flickers on, sits above the mark */
.neon{
  width:34cqmin;max-width:230px;aspect-ratio:1/1.02;
  border:0.8cqmin solid var(--neon);border-radius:1.4cqmin;
  display:grid;grid-template-rows:repeat(4,1fr);
  font-family:var(--font-body);font-weight:500;color:var(--neon);
  letter-spacing:0.6cqmin;opacity:0;
  filter:drop-shadow(0 0 1.4cqmin var(--neon)) drop-shadow(0 0 3cqmin oklch(0.55 0.2 27 / 0.5));
}
.neon span{display:grid;place-items:center;font-size:5cqmin;border-top:0.45cqmin solid var(--neon)}
.neon span:first-child{border-top:0}
.neon.on{animation:flick 1.2s var(--ease-out) .3s forwards}
@keyframes flick{
  0%{opacity:0}10%{opacity:.95}15%{opacity:.12}24%{opacity:1}30%{opacity:.35}
  38%{opacity:1}55%{opacity:.6}100%{opacity:1}
}
/* the wordmark lockup */
.mark{width:46cqmin;max-width:400px;height:auto;display:block}
.mark .ring{
  fill:none;stroke:var(--fg);stroke-width:17;stroke-linecap:round;
  opacity:0;transform-box:fill-box;transform-origin:center;
  animation:pop .5s var(--ease-out) forwards;
}
.mark .r1{animation-delay:1.35s}
.mark .arch{animation-delay:1.5s}
.mark .r2{animation-delay:1.65s}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.mark .bar{
  fill:var(--accent);transform-box:fill-box;transform-origin:left center;
  transform:scaleX(0);animation:draw .55s 1.95s var(--ease-out) forwards;
}
@keyframes draw{to{transform:scaleX(1)}}
.tag{
  font-family:var(--font-display);font-weight:800;font-size:4.8cqmin;color:var(--fg);
  text-align:center;opacity:0;transform:translateY(1.6cqmin);
  animation:rise .5s 2.5s var(--ease-out) forwards;
}
.sub{
  font-size:2.3cqmin;color:var(--muted);text-align:center;
  opacity:0;animation:rise .5s 2.75s var(--ease-out) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.txt{display:grid;gap:2cqmin}

.replay{
  position:absolute;right:3cqmin;bottom:3cqmin;
  font-family:var(--font-body);font-size:min(14px,3.4cqmin);color:var(--muted);
  background:transparent;border:1px solid oklch(0.4 0.01 50);border-radius:999px;
  padding:.5em 1.1em;cursor:pointer;opacity:0;animation:rise .4s 3.2s var(--ease-out) forwards;
}
.replay:hover{color:var(--fg);border-color:var(--fg)}
.replay:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .neon,.neon.on,.mark .ring,.mark .arch,.mark .bar,.tag,.sub,.replay{
    animation:none!important;opacity:1!important;transform:none!important;
  }
  .mark .bar{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="neon on" id="neon" aria-hidden="true">
    <span>DRINK</span><span>SAKE</span><span>STAY</span><span>SOBA</span>
  </div>
  <svg class="mark" viewBox="0 0 300 150" role="img" aria-label="Ono Sushi">
    <circle class="ring r1" cx="48" cy="66" r="36"/>
    <path class="ring arch" d="M84 102 L84 62 C84 46 96 36 112 36 C128 36 140 46 140 62 L140 102"/>
    <circle class="ring r2" cx="176" cy="66" r="36"/>
    <rect class="bar" x="14" y="120" width="200" height="13" rx="6.5"/>
  </svg>
  <div class="txt">
    <div class="tag">Drink sake. Stay soba.</div>
    <div class="sub">Ono Sushi&nbsp;&nbsp;&bull;&nbsp;&nbsp;Las Vegas, NV&nbsp;&nbsp;&bull;&nbsp;&nbsp;@onosushilv</div>
  </div>
  <button class="replay" id="replay" type="button">Replay</button>
</div>
<script>
(function(){
  var replay=document.getElementById('replay');
  var stage=document.getElementById('stage');
  replay.addEventListener('click',function(){
    stage.querySelectorAll('.mark .ring,.mark .arch,.mark .bar,.tag,.sub').forEach(function(el){
      el.style.animation='none';el.offsetHeight;el.style.animation='';
    });
    var n=document.getElementById('neon');n.classList.remove('on');n.offsetHeight;n.classList.add('on');
  });
})();
</script>
</body>
</html>
