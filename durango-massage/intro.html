<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Durango Massage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html,body{background:#22302A}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vw,20px);padding:clamp(12px,3vw,24px)}

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #22302A;
    --ink-deep: #1B2621;
    --paper: #F0ECE1;
    --green: #3C6B4F;
    --brass: #B07D3A;
    --brass-light: #D8B27A;
    --muted: #5C6B62;
  }

  html, body { height: 100%; }

  body {
    background: var(--ink-deep);
    font-family: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ---- Responsive cinematic frame ---------------------------------- */
  .frame {
    position: relative;
    width: min(100%, 177.78vh);
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    background: var(--ink);
    overflow: hidden;
    isolation: isolate;
  }

  /* ---- Dark fir field with drifting light leaks ------------------- */
  .field {
    position: absolute;
    inset: -6%;
    background:
      radial-gradient(58% 46% at 84% 14%, rgba(176, 125, 58, 0.24), transparent 62%),
      radial-gradient(52% 44% at 12% 90%, rgba(176, 125, 58, 0.12), transparent 66%),
      radial-gradient(46% 58% at 8% 18%, rgba(60, 107, 79, 0.20), transparent 72%),
      radial-gradient(80% 66% at 50% 122%, rgba(20, 30, 26, 0.92), transparent 60%),
      linear-gradient(150deg, #27352F 0%, #22302A 46%, #1A251F 100%);
    animation: drift 30s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes drift {
    0%   { transform: scale(1.04) translate(0, 0); }
    100% { transform: scale(1.09) translate(-1.6%, 1.4%); }
  }

  .frame.playing .field {
    animation: drift 30s ease-in-out infinite alternate, expose 1.8s ease-out both;
  }

  @keyframes expose {
    0%   { filter: brightness(0.42) saturate(0.8); }
    100% { filter: brightness(1) saturate(1); }
  }

  /* ---- Single accent moment: brass light leak sweep -------------- */
  .sweep {
    position: absolute;
    inset: -30% -45%;
    background: linear-gradient(
      104deg,
      transparent 42%,
      rgba(176, 125, 58, 0.05) 47%,
      rgba(216, 178, 122, 0.34) 50%,
      rgba(240, 236, 225, 0.10) 53%,
      transparent 59%
    );
    mix-blend-mode: screen;
    transform: translateX(-78%);
    opacity: 0;
    pointer-events: none;
  }

  .frame.playing .sweep {
    animation: sweep 3s cubic-bezier(0.37, 0, 0.28, 1) 3.9s forwards;
  }

  @keyframes sweep {
    0%   { transform: translateX(-78%); opacity: 0; }
    18%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { transform: translateX(78%); opacity: 0; }
  }

  /* ---- 35mm grain ---------------------------------------------------- */
  .grain {
    position: absolute;
    inset: -60%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='170' height='170' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity: 0.09;
    mix-blend-mode: overlay;
    pointer-events: none;
    animation: grainmove 1.1s steps(2) infinite;
  }

  @keyframes grainmove {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-3%, 2%); }
    100% { transform: translate(2%, -2%); }
  }

  /* ---- Vignette + soft letterbox ---------------------------------- */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 44%, transparent 46%, rgba(12, 18, 15, 0.62) 100%);
    pointer-events: none;
  }

  .bar {
    position: absolute;
    left: 0;
    right: 0;
    height: clamp(16px, 3.4cqw, 58px);
    z-index: 30;
    pointer-events: none;
  }
  .bar--top    { top: 0;    background: linear-gradient(to bottom, rgba(12, 18, 15, 0.85), transparent); }
  .bar--bottom { bottom: 0; background: linear-gradient(to top,    rgba(12, 18, 15, 0.85), transparent); }

  /* ---- Corner captions ------------------------------------------- */
  .cap {
    position: absolute;
    z-index: 25;
    font-family: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(9px, 1.45cqw, 13px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: rgba(216, 178, 122, 0.62);
    opacity: 0;
  }
  .cap--tl { top: clamp(12px, 4.5cqw, 44px); left: clamp(14px, 5cqw, 52px); }
  .cap--bl { bottom: clamp(12px, 3.4cqw, 34px); left: clamp(14px, 5cqw, 52px); color: rgba(240, 236, 225, 0.42); }

  .frame.playing .cap--tl { animation: rise 1.2s ease-out 1s forwards; }
  .frame.playing .cap--bl { animation: rise 1.2s ease-out 5.6s forwards; }

  @keyframes rise {
    0%   { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---- Centre lockup -------------------------------------------- */
  .lockup {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: translateY(-2cqw);
  }

  .monogram {
    width: 6cqw;
    height: 6cqw;
    border-radius: 50%;
    border: max(1px, 0.16cqw) solid rgba(176, 125, 58, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.4cqw;
    opacity: 0;
  }
  .monogram span {
    font-family: 'Fraunces', 'Helvetica Neue', Arial, serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: 3cqw;
    color: var(--brass-light);
    line-height: 1;
  }

  .wordmark {
    font-family: 'Fraunces', 'Helvetica Neue', Arial, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 12cqw;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--paper);
    opacity: 0;
  }

  .label {
    font-family: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    font-size: 2.15cqw;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-indent: 0.1em;
    color: var(--brass);
    margin-top: 1.7cqw;
    opacity: 0;
  }

  .hairline {
    width: 0;
    height: max(1px, 0.13cqw);
    background: var(--brass);
    margin: 3cqw auto 2.7cqw;
    opacity: 0;
  }

  .tagline {
    font-family: 'Fraunces', 'Helvetica Neue', Arial, serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: italic;
    font-size: 3cqw;
    line-height: 1.4;
    color: rgba(240, 236, 225, 0.84);
    opacity: 0;
  }

  .meta {
    font-family: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    font-size: 1.55cqw;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: rgba(176, 125, 58, 0.92);
    margin-top: 2cqw;
    opacity: 0;
  }

  /* ---- Entrance timeline (only while .playing) ------------------ */
  .frame.playing .monogram { animation: settle 1.6s ease-out 0.4s forwards; }
  .frame.playing .wordmark { animation: wordUp 2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.7s forwards; }
  .frame.playing .label    { animation: labelResolve 1.5s ease-out 2.5s forwards; }
  .frame.playing .hairline { animation: hairExtend 1s ease-out 3.6s forwards; }
  .frame.playing .tagline  { animation: fadeUp 1.4s ease-out 4.7s forwards; }
  .frame.playing .meta     { animation: fadeUp 1.3s ease-out 5.6s forwards; }

  @keyframes settle {
    0%   { opacity: 0; transform: scale(0.92); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes wordUp {
    0%   { opacity: 0; transform: translateY(0.9cqw); filter: blur(6px); letter-spacing: 0.04em; }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); letter-spacing: -0.02em; }
  }
  @keyframes labelResolve {
    0%   { opacity: 0; letter-spacing: 0.02em; text-indent: 0.02em; }
    100% { opacity: 1; letter-spacing: 0.42em; text-indent: 0.42em; }
  }
  @keyframes hairExtend {
    0%   { width: 0; opacity: 0; }
    12%  { opacity: 1; }
    100% { width: 26cqw; opacity: 1; }
  }
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(0.5cqw); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---- Controls ------------------------------------------------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 16px;
    opacity: 0;
  }
  .frame.playing ~ .controls { animation: rise 1s ease-out 6.2s forwards; }
  .controls .btn { font-size: 12px; }

  .btn {
    font-family: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(10px, 1.4cqw, 13px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: clamp(8px, 1.1cqw, 12px) clamp(14px, 2cqw, 22px);
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .btn--replay {
    background: rgba(240, 236, 225, 0.10);
    border: 1px solid rgba(240, 236, 225, 0.34);
    color: var(--paper);
  }
  .btn--replay:hover {
    background: rgba(240, 236, 225, 0.22);
    border-color: rgba(240, 236, 225, 0.55);
    color: var(--paper);
  }
  .btn--site {
    background: transparent;
    border: 1px solid rgba(176, 125, 58, 0.6);
    color: var(--brass-light);
  }
  .btn--site:hover {
    background: rgba(176, 125, 58, 0.20);
    border-color: var(--brass);
    color: var(--paper);
  }
  .btn:focus-visible {
    outline: 2px solid var(--brass-light);
    outline-offset: 3px;
  }

  /* ---- Narrow frames ------------------------------------------- */
  @container (max-width: 560px) {
    .lockup   { transform: translateY(-4.5cqw); }
    .wordmark { font-size: 13cqw; }
    .tagline  { font-size: 3.2cqw; }
    .label    { font-size: 2.5cqw; margin-top: 1.5cqw; }
    .meta     { font-size: 1.9cqw; margin-top: 1.5cqw; }
    .monogram { width: 6.4cqw; height: 6.4cqw; margin-bottom: 2cqw; }
    .monogram span { font-size: 3.2cqw; }
    .hairline { margin: 2.2cqw auto 2cqw; }
    .cap--tl  { display: none; }
    .btn      { letter-spacing: 0.1em; }
  }

  /* ---- Reduced motion: show the held frame, no animation ------- */
  @media (prefers-reduced-motion: reduce) {
    .frame .field,
    .frame.playing .field { animation: none; filter: none; }
    .frame .grain { animation: none; }
    .frame .sweep,
    .frame.playing .sweep { display: none; }
    .frame.playing .monogram,
    .frame.playing .wordmark,
    .frame.playing .label,
    .frame.playing .hairline,
    .frame.playing .tagline,
    .frame.playing .meta,
    .frame.playing .controls,
    .frame.playing .cap--tl,
    .frame.playing .cap--bl {
      animation: none;
      opacity: 1;
      transform: none;
      filter: none;
    }
    .frame.playing .label    { letter-spacing: 0.42em; text-indent: 0.42em; }
    .frame.playing .hairline { width: 26cqw; }
  }
</style>
</head>
<body>
  <div class="frame" id="frame" data-od-id="brand-intro-frame">
    <div class="field" aria-hidden="true"></div>
    <div class="sweep" aria-hidden="true"></div>

    <div class="bar bar--top" aria-hidden="true"></div>
    <div class="bar bar--bottom" aria-hidden="true"></div>

    <p class="cap cap--tl" data-od-id="caption-day-spa">Day Spa</p>
    <p class="cap cap--bl" data-od-id="caption-handle">@durangomassagenv</p>

    <div class="lockup" data-od-id="wordmark-lockup" role="img" aria-label="Durango Massage. An hour that resets the week. Las Vegas, NV.">
      <div class="monogram" aria-hidden="true"><span>D</span></div>
      <div class="wordmark">Durango</div>
      <div class="label">Massage</div>
      <div class="hairline" aria-hidden="true"></div>
      <div class="tagline">An hour that resets the week.</div>
      <div class="meta">Las Vegas, NV</div>
    </div>


    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
  </div>

    <div class="controls" data-od-id="intro-controls">
      <button type="button" class="btn btn--replay" id="replay" data-od-id="replay-button">Replay</button>
      <a class="btn btn--site" href="./" data-od-id="visit-site-link">Visit the site</a>
    </div>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var replay = document.getElementById('replay');

      function play() {
        frame.classList.remove('playing');
        void frame.offsetWidth; /* force reflow so animations restart */
        frame.classList.add('playing');
      }

      replay.addEventListener('click', play);

      if (document.readyState === 'complete') {
        play();
      } else {
        window.addEventListener('load', play);
      }
    })();
  </script>
</body>
</html>
