<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4e8">
<title>BEACH CAFE &middot; A beach in the middle of the desert.</title>
<meta name="description" content="BEACH CAFE &middot; all-day breakfast and lunch in southwest Las Vegas. A beach in the middle of the desert, since 2007.">
<script>document.documentElement.className='js';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --color-ink:#1e4068;
  --color-ink:oklch(0.30 0.055 245);
  --color-paper:#f8f4e8;
  --color-paper:oklch(0.965 0.009 90);
  --color-accent:#ffd23f;
  --color-accent:oklch(0.85 0.145 92);
  --color-sky:#5aa7d8;
  --color-sky:oklch(0.64 0.10 235);
  --color-muted:#5d6c82;
  --color-muted:oklch(0.47 0.035 240);
  --color-line:rgba(30,64,104,.14);
  --color-line:oklch(0.30 0.055 245 / 0.14);
  --font-display:"Baloo 2","Trebuchet MS",sans-serif;
  --font-body:"Mulish",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease-elastic:cubic-bezier(.34,1.56,.64,1);
  --ease-out-slow:cubic-bezier(.65,0,.35,1);
  --ease-rise:cubic-bezier(.22,1,.36,1);
  --fs-wordmark:clamp(1.9rem,min(8.5cqw,13cqh),6rem);
  --fs-tagline:clamp(1rem,min(2.6cqw,4.2cqh),1.6rem);
  --fs-lockup:clamp(.9rem,min(1.8cqw,2.8cqh),1.05rem);
  --fs-replay:.78rem;
  --ring-size:clamp(84px,min(24cqw,34cqh),300px);
  --gap-stack:clamp(1.1rem,3cqw,2.8rem);
  --gap-words:clamp(.22em,.6cqw,.5em);
  --track-l:.08em;
  --track-m:.06em;
  --pad-stage:clamp(1.1rem,5vw,2.6rem);
  --radius-pill:999px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{
  font-family:var(--font-body);
  color:var(--color-ink);
  background:var(--color-paper);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

.stage{
  height:100vh;
  height:100dvh;
  overflow:hidden;
  container-type:size;
  display:grid;
  place-items:center;
}

.compose{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:var(--gap-stack);
  padding:var(--pad-stage);
  max-width:min(100%,70ch);
}

.ring-frame{width:var(--ring-size);height:var(--ring-size)}
.ring{width:100%;height:100%;display:block;overflow:visible}
.ring circle{fill:none}
.ring-halo{stroke:var(--color-accent);stroke-width:1.2;opacity:.22}
.ring-base{stroke:var(--color-ink);stroke-width:3.2;stroke-linecap:round}
.ring-accent{
  stroke:var(--color-sky);
  stroke-width:5;
  stroke-linecap:round;
  stroke-dasharray:117.3 586.4;
}

.wordmark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:var(--fs-wordmark);
  line-height:1.05;
  letter-spacing:var(--track-l);
  text-transform:uppercase;
  color:var(--color-ink);
  white-space:nowrap;
  display:flex;
  gap:var(--gap-words);
}

.tagline{
  font-family:var(--font-display);
  font-weight:600;
  font-size:var(--fs-tagline);
  letter-spacing:var(--track-m);
  text-transform:uppercase;
  color:var(--color-muted);
  text-wrap:balance;
  max-width:34ch;
}

.lockup{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:.55em;
  font-size:var(--fs-lockup);
  font-weight:600;
  letter-spacing:.02em;
  color:var(--color-muted);
}
.lockup a{
  color:var(--color-ink);
  text-underline-offset:.28em;
}
.lockup a:hover{color:var(--color-sky)}
.dot{opacity:.55}

.replay{
  position:fixed;
  right:max(1rem,env(safe-area-inset-right));
  bottom:max(1rem,env(safe-area-inset-bottom));
  display:inline-flex;
  align-items:center;
  gap:.5em;
  min-height:44px;
  padding:.7rem 1.1rem;
  font-family:var(--font-body);
  font-weight:700;
  font-size:var(--fs-replay);
  letter-spacing:var(--track-m);
  text-transform:uppercase;
  color:var(--color-ink);
  background:var(--color-paper);
  border:2px solid var(--color-ink);
  border-radius:var(--radius-pill);
  cursor:pointer;
  transition:background-color .2s ease,color .2s ease,transform .2s ease;
}
.replay svg{flex:none}
.replay:hover{background:var(--color-ink);color:var(--color-paper)}
.replay:active{transform:scale(.96)}
.replay:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}

@keyframes ring-draw{
  from{stroke-dashoffset:703.7;opacity:0}
  to{stroke-dashoffset:0;opacity:1}
}
@keyframes settle{
  from{transform:scale(.86);opacity:.45}
  to{transform:scale(1);opacity:1}
}
@keyframes rise{
  from{transform:translateY(26px);opacity:0}
  to{transform:none;opacity:1}
}
@keyframes accent-pulse{
  from{opacity:0;stroke-width:2}
  to{opacity:1;stroke-width:5}
}
@keyframes breathe{
  from{transform:scale(1)}
  to{transform:scale(1.015)}
}
@keyframes fm-in{
  from{opacity:0}
  to{opacity:1}
}

.js .ring-base,
.js .ring-accent,
.js .w,
.js .tagline,
.js .lockup{opacity:0}

.is-playing .ring-base{
  animation:ring-draw 1.5s var(--ease-out-slow) .5s both;
}
.is-playing .ring-frame{
  animation:
    settle .8s var(--ease-elastic) 2.05s both,
    breathe 8s ease-in-out 5.6s infinite alternate;
}
.is-playing .w{animation:rise .7s var(--ease-rise) both}
.is-playing .w1{animation-delay:2.7s}
.is-playing .w2{animation-delay:3s}
.is-playing .tagline{animation:rise .7s var(--ease-rise) 3.7s both}
.is-playing .ring-accent{animation:accent-pulse .9s var(--ease-rise) 4.4s both}
.is-playing .lockup{animation:rise .6s var(--ease-rise) 4.9s both}

@media (prefers-reduced-motion:reduce){
  .is-playing .compose{animation:fm-in .8s ease .05s both}
  .is-playing .compose *{
    animation:none !important;
    opacity:1 !important;
    transform:none !important;
  }
}
</style>
</head>
<body>
<main class="stage" aria-live="polite">
  <div class="compose">
    <div class="ring-frame" aria-hidden="true">
      <svg class="ring" viewBox="0 0 240 240">
        <circle class="ring-halo" cx="120" cy="120" r="118"></circle>
        <circle class="ring-base" cx="120" cy="120" r="112"></circle>
        <circle class="ring-accent" cx="120" cy="120" r="112" transform="rotate(-30 120 120)"></circle>
      </svg>
    </div>
    <h1 class="wordmark"><span class="w w1">BEACH</span><span class="w w2">CAFE</span></h1>
    <p class="tagline">A beach in the middle of the desert.</p>
    <p class="lockup">
      <a href="tel:+17028985200">(702) 898-5200</a>
      <span class="dot" aria-hidden="true">&middot;</span>
      <a href="https://instagram.com/beachcafe_lv" rel="noopener">@beachcafe_lv</a>
      <span class="dot" aria-hidden="true">&middot;</span>
      <span>7750 S Jones Blvd Ste 101, Las Vegas, NV 89139</span>
    </p>
  </div>
  <button class="replay" type="button" aria-label="Replay the intro animation">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
    <span>Replay</span>
  </button>
</main>
<script>
(function(){
  var stage=document.querySelector('.stage');
  var btn=document.querySelector('.replay');
  function play(){
    stage.classList.remove('is-playing');
    void stage.offsetWidth;
    stage.classList.add('is-playing');
  }
  play();
  btn.addEventListener('click',play);
})();
</script>
</body>
</html>
