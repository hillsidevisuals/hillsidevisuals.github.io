<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJ INKS | Brand Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@page{size:1280px 720px;margin:0}
:root{
  --bg:#0C0C0E;
  --surface:oklch(0.185 0.006 300);
  --raised:oklch(0.235 0.007 300);
  --bone:#EFE9DC;
  --muted:oklch(0.76 0.012 90);
  --faint:oklch(0.76 0.012 90 / 0.6);
  --line:oklch(0.95 0.014 90 / 0.12);
  --line-strong:oklch(0.95 0.014 90 / 0.24);
  --accent:#D93A21;
  --font-display:"Oswald","Helvetica Neue",Arial,sans-serif;
  --font-body:"Inter","Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--bone);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* page shell around the 16:9 frame */
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 24px}
.frame{position:relative;width:min(1200px,100%);aspect-ratio:16 / 9;container-type:inline-size;font-size:1cqw;background:var(--bg);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.frame-bg{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 44%,var(--raised) 0%,var(--bg) 62%)}
.frame::before{content:"";position:absolute;inset:2.6em;border:1px solid var(--line);pointer-events:none;z-index:3}
.frame-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.controls{margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.page-meta{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.replay{font:inherit;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);
  background:transparent;border:1px solid var(--line);padding:9px 16px;cursor:pointer;font-family:var(--font-display)}
.replay:hover{border-color:var(--bone)}
.visit{color:var(--faint);text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-family:var(--font-display)}
.visit:hover{color:var(--bone)}
.replaying .seal,.replaying .wc-letter,.replaying .brush path,.replaying .tagline,.replaying .meta,.replaying .corner{animation:none}

/* lockup group */
.lockup{display:flex;align-items:center;gap:2em}
.seal{width:clamp(40px,7em,130px);height:clamp(40px,7em,130px);flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--bg);font-family:var(--font-display);font-size:clamp(16px,2.6em,52px);font-weight:700;letter-spacing:.02em;line-height:1;border-radius:0;transform:rotate(-4deg);animation:seal-in .62s cubic-bezier(.34,1.56,.64,1) both;will-change:transform,opacity,filter}
.wordmark{font-family:var(--font-display);font-size:clamp(26px,7.5em,140px);font-weight:700;text-transform:uppercase;color:var(--bone);line-height:1}
.wc-letter{display:inline-block;padding-right:.14em;animation:char-in .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.55s + var(--i)*.07s)}
.wc-sp{display:inline-block;width:.55em}

/* brush stroke sweep */
.brush{width:42em;height:1.6em;margin-top:1.3em;opacity:.92}
.brush path{fill:none;stroke:var(--accent);stroke-width:clamp(2.5px,.28em,6px);stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;stroke-dashoffset:100;animation:sweep .85s ease-out 1.25s both}

/* tagline and meta */
.tagline{margin-top:1.1em;font-size:clamp(15px,1.9em,32px);color:var(--muted);letter-spacing:.02em;animation:rise .8s ease-out 2.3s both}
.meta{display:flex;align-items:center;gap:1.2em;margin-top:2.2em;font-size:clamp(10px,1.3em,22px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);animation:rise .7s ease-out 2.7s both}
.meta .sep{color:var(--line-strong)}

/* corner captions */
.corner{position:absolute;bottom:2.8em;z-index:4;font-size:clamp(9px,1.15em,20px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);animation:rise .7s ease-out 3.1s both}
.corner-l{left:2.8em}
.corner-r{right:2.8em}

/* keyframes */
@keyframes seal-in{
  0%{opacity:0;transform:scale(2) rotate(-12deg);filter:brightness(1.5)}
  55%{opacity:1;transform:scale(.9) rotate(-5deg);filter:brightness(1.3)}
  78%{transform:scale(1.06) rotate(-3deg);filter:brightness(1.1)}
  100%{transform:scale(1) rotate(-4deg);filter:brightness(1)}
}
@keyframes char-in{
  0%{opacity:0;transform:translateY(.9em)}
  65%{opacity:1;transform:translateY(-.06em)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes sweep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes rise{
  0%{opacity:0;transform:translateY(.8em)}
  60%{opacity:1;transform:translateY(-.05em)}
  100%{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .seal,.wc-letter,.brush path,.tagline,.meta,.corner{animation:none}
}
</style>
</head>
<body>

<main class="wrap">
  <section class="frame" data-od-id="intro-stage" aria-label="BJ INKS brand intro, six second reveal">
    <div class="frame-bg" aria-hidden="true"></div>

    <div class="frame-inner">
      <div class="lockup">
        <span class="seal" data-od-id="intro-seal" aria-label="BJ monogram seal">BJ</span>
        <h1 class="wordmark" data-od-id="intro-wordmark">
          <span class="wc-letter" style="--i:0">B</span><span class="wc-letter" style="--i:1">J</span><span class="wc-sp" aria-hidden="true"></span><span class="wc-letter" style="--i:2">I</span><span class="wc-letter" style="--i:3">N</span><span class="wc-letter" style="--i:4">K</span><span class="wc-letter" style="--i:5">S</span>
        </h1>
      </div>

      <svg class="brush" viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true" data-od-id="intro-brush">
        <path d="M 10 12 C 110 5, 220 19, 330 12 C 420 7, 520 16, 590 9"/>
      </svg>

      <p class="tagline" data-od-id="intro-tagline">Custom tattooing in Las Vegas. By appointment.</p>

      <div class="meta" data-od-id="intro-meta">
        <span>Las Vegas, NV</span>
        <span class="sep" aria-hidden="true">·</span>
        <span>@bj_inks</span>
      </div>
    </div>

    <p class="corner corner-l" data-od-id="intro-corner-l">BJ INKS · Brand intro</p>
    <p class="corner corner-r" data-od-id="intro-corner-r">Six second reveal</p>
  </section>

  <div class="controls">
    <span class="page-meta" data-od-id="page-meta">BJ INKS · brand intro · 6s</span>
    <button class="replay" type="button">Replay</button>
    <a class="visit" href="./">Visit the site</a>
  </div>
</main>

<script>
(function(){
  var frame = document.querySelector('.frame');
  var btn = document.querySelector('.replay');
  if(btn && frame){
    btn.addEventListener('click', function(){
      frame.classList.add('replaying');
      void frame.offsetWidth;
      frame.classList.remove('replaying');
    });
  }
})();
</script>

</body>
</html>
