<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Intro | Durango Social Club</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #2B2321;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #C29B62;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
        }
        .text-container {
            text-align: center;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
        }
        .subtitle {
            color: #EAE4DB;
            font-size: 1.5rem;
            opacity: 0;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="text-container">
        <h1 class="title">Durango Social Club</h1>
        <div class="subtitle">The Modern Supper Club</div>
    </div>
    <script>
        gsap.to(".title", {
            clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)",
            duration: 1.5,
            ease: "power4.out",
            delay: 0.5
        });
        gsap.to(".subtitle", {
            opacity: 1,
            y: -10,
            duration: 1,
            delay: 1.5
        });
    </script>
</body>
</html>
