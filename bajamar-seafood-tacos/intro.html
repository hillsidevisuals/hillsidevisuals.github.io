<!DOCTYPE html>
<!-- fingerprint: P5 H5 E4 S5 R3 V5
     Bajamar brand intro - bespoke, matched to the existing octopus/surfboard identity.
     creative-voltage feel: the badge drops with a bounce, a lime surfboard rule wipes across,
     BAJAMAR pops up letter by letter, RAINBOW + the tagline settle. Held final lockup. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bajamar Seafood &amp; Tacos | Brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:oklch(0.24 0.022 205);
    --deep-2:oklch(0.30 0.04 200);
    --sand:oklch(0.95 0.02 84);
    --muted:oklch(0.82 0.02 110);
    --faint:oklch(0.68 0.02 120);
    --sea:oklch(0.71 0.105 195);
    --surf:oklch(0.79 0.17 129);
    --coral:oklch(0.62 0.19 27);
    --font-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
    --font-body:"Karla","Helvetica Neue",Arial,sans-serif;
    --ease-pop:cubic-bezier(.34,1.4,.64,1);
    --ease-out:cubic-bezier(.22,.61,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep)}
  body{color:var(--sand);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:clamp(14px,4vw,32px)}
  .frame{position:relative;width:min(1120px,100%);aspect-ratio:16/9;container-type:inline-size;
    font-size:1cqw;background:
      radial-gradient(70% 80% at 50% 42%, var(--deep-2) 0%, var(--deep) 60%);
    overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.5)}
  /* faint concentric "bubbles" ring, matched to the badge disc */
  .frame::before{content:"";position:absolute;left:50%;top:42%;width:90cqw;height:90cqw;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle, transparent 38%, oklch(0.71 0.105 195 / .08) 39%, transparent 41%),
      radial-gradient(circle, transparent 52%, oklch(0.71 0.105 195 / .06) 53%, transparent 55%);
    animation:breathe 5s ease-in-out infinite alternate 1.4s;opacity:.55}
  .inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 6cqw;text-align:center}

  .badge{width:clamp(64px,20cqw,240px);height:clamp(64px,20cqw,240px);
    animation:badge-drop .72s var(--ease-pop) both}
  .board{width:min(52cqw,72%);height:1.1cqw;margin-top:2.6cqw;position:relative;overflow:hidden}
  .board::after{content:"";position:absolute;inset:0;background:var(--surf);border-radius:2px;
    transform:scaleX(0);transform-origin:left;animation:wipe .4s var(--ease-out) .3s both}

  .wordmark{margin-top:3cqw;font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;
    font-size:clamp(34px,15cqw,190px);line-height:.9;color:var(--sand);white-space:nowrap}
  .wordmark .l{display:inline-block;animation:char-in .4s var(--ease-pop) both;
    animation-delay:calc(.45s + var(--i) * .035s)}
  .locbar{margin-top:2.4cqw;display:flex;align-items:center;gap:1.4cqw;
    font-family:var(--font-display);font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    font-size:clamp(11px,2.2cqw,30px);color:var(--surf);
    animation:rise .4s var(--ease-out) .8s both}
  .locbar .dot{width:.5em;height:.5em;background:var(--coral);border-radius:50%}
  .tagline{margin-top:3cqw;font-size:clamp(12px,2cqw,30px);color:var(--muted);max-width:34ch;
    animation:rise .45s var(--ease-out) .95s both}
  .meta{margin-top:3.2cqw;font-size:clamp(9px,1.3cqw,19px);font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);animation:rise .4s var(--ease-out) 1.05s both}

  @media (max-width:640px){
    .frame{aspect-ratio:4/5}
    .wordmark{font-size:clamp(30px,13cqw,90px);margin-top:5cqw}
    .badge{width:clamp(56px,26cqw,150px);height:clamp(56px,26cqw,150px)}
    .board{margin-top:5cqw}
    .locbar{font-size:clamp(10px,3cqw,16px);letter-spacing:.14em;margin-top:5cqw}
    .tagline{margin-top:6cqw;font-size:clamp(12px,3.4cqw,18px)}
    .meta{margin-top:6cqw}
  }

  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .page-meta{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .replay{font:inherit;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--sand);background:transparent;border:1px solid var(--faint);padding:9px 16px;cursor:pointer;border-radius:3px}
  .replay:hover{border-color:var(--sand)}
  .visit{color:var(--faint);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .visit:hover{color:var(--sand)}

  @keyframes badge-drop{0%{opacity:0;transform:translateY(-40cqw) scale(.4) rotate(-18deg)}
    60%{opacity:1;transform:translateY(0) scale(1.06) rotate(4deg)}
    100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  @keyframes wipe{to{transform:scaleX(1)}}
  @keyframes char-in{0%{opacity:0;transform:translateY(.7em) scale(.9)}
    70%{opacity:1;transform:translateY(-.04em) scale(1)}100%{opacity:1;transform:none}}
  @keyframes rise{0%{opacity:0;transform:translateY(.7em)}100%{opacity:1;transform:none}}
  @keyframes breathe{from{opacity:.5;transform:translate(-50%,-50%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1.02)}}
  @media (prefers-reduced-motion:reduce){
    .badge,.board::after,.wordmark .l,.locbar,.tagline,.meta,.frame::before{animation:none;opacity:1;transform:none}
    .board::after{transform:scaleX(1)}
  }
  .replaying .badge,.replaying .board::after,.replaying .wordmark .l,
  .replaying .locbar,.replaying .tagline,.replaying .meta{animation:none}
</style>
</head>
