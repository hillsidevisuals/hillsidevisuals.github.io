<!DOCTYPE html>
<!-- fingerprint: P5 H4 E4 S5 R4 V4 — Bajamar brand intro, bespoke (re-composed, not a template swap).
     Concept: a turquoise octopus tentacle-curl draws itself, a coral spark crosses it, the
     BAJAMAR wordmark sets letter by letter, holds on a full lockup. ~3s reveal, holds. Fluid (cqw).
     QA: append ?final to the URL to freeze on the held end frame. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bajamar Seafood &amp; Tacos | Brand intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:oklch(0.17 0.008 60);
    --sand:oklch(0.94 0.021 82);
    --sea:oklch(0.72 0.112 191);
    --sea-glow:oklch(0.52 0.086 199);
    --accent:oklch(0.62 0.196 27);
    --muted:oklch(0.94 0.021 82 / 0.74);
    --faint:oklch(0.94 0.021 82 / 0.52);
    --line:oklch(0.94 0.021 82 / 0.16);
    --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --font-body:"Karla",-apple-system,"Segoe UI",sans-serif;
    --ease-out:cubic-bezier(0.22,1,0.36,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  body{color:var(--sand);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:clamp(14px,4vw,32px)}
  .frame{position:relative;width:min(1120px,100%);aspect-ratio:16/9;container-type:inline-size;
    font-size:1cqw;background:var(--ink);overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.5)}
  .frame-bg{position:absolute;inset:0;background:radial-gradient(64% 74% at 50% 42%,var(--sea-glow) 0%,var(--ink) 64%);opacity:0;animation:glow .9s var(--ease-out) .1s both}
  .frame::before{content:"";position:absolute;inset:3.2cqw;border:1px solid var(--line);pointer-events:none;z-index:3}
  .inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6cqw;text-align:center}

  .tentacle{width:min(26cqw,48%);margin-bottom:2.4cqw;overflow:visible}
  .tentacle path{fill:none;stroke:var(--sea);stroke-width:clamp(3px,1.1cqw,14px);stroke-linecap:round;
    stroke-dasharray:520;stroke-dashoffset:520;animation:draw .95s var(--ease-out) .3s both}
  .tentacle circle{fill:var(--sea);opacity:0;animation:pop .28s var(--ease-out) both}
  .tentacle circle:nth-of-type(1){animation-delay:.95s}
  .tentacle circle:nth-of-type(2){animation-delay:1.05s}
  .tentacle circle:nth-of-type(3){animation-delay:1.15s}
  .spark{position:absolute;top:calc(50% - 8.5cqw);left:0;width:100%;height:.5cqw;overflow:hidden;z-index:2}
  .spark::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:cross .5s var(--ease-out) 1.05s both}

  .lockup{display:flex;flex-direction:column;align-items:center;gap:1.1cqw;max-width:100%}
  .wordmark{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,12cqw,150px);
    letter-spacing:-.02em;color:var(--sand);line-height:.9;white-space:nowrap}
  .wordmark .l{display:inline-block;animation:char .42s var(--ease-out) both;animation-delay:calc(1.2s + var(--i) * .05s)}
  .sub{display:flex;align-items:center;gap:1.4cqw;opacity:0;animation:rise .6s var(--ease-out) 1.75s both}
  .sub .rule{width:7cqw;height:2px;background:var(--sea)}
  .sub span{font-family:var(--font-display);font-weight:700;font-size:clamp(9px,1.6cqw,24px);letter-spacing:.32em}
  .tagline{margin-top:2.8cqw;font-size:clamp(12px,1.9cqw,30px);color:var(--muted);animation:rise .6s var(--ease-out) 2s both}
  .meta{display:flex;align-items:center;justify-content:center;gap:1.4cqw;flex-wrap:wrap;margin-top:2.4cqw;
    font-size:clamp(9px,1.2cqw,18px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);animation:rise .6s var(--ease-out) 2.2s both}

  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .page-meta{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .replay{font:inherit;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--sand);background:transparent;border:1px solid var(--line);padding:9px 16px;cursor:pointer}
  .replay:hover{border-color:var(--sand)}
  .visit{color:var(--faint);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .visit:hover{color:var(--sand)}

  @keyframes glow{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
  @keyframes cross{0%{left:-40%}100%{left:120%}}
  @keyframes char{0%{opacity:0;transform:translateY(.8em)}70%{opacity:1;transform:translateY(-.03em)}100%{opacity:1;transform:translateY(0)}}
  @keyframes rise{0%{opacity:0;transform:translateY(.7em)}100%{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){
    .frame-bg,.tentacle path,.tentacle circle,.wordmark .l,.sub,.tagline,.meta,.spark::after{animation-duration:.001ms!important;animation-delay:0s!important;opacity:1}
    .tentacle path{stroke-dashoffset:0}
  }
  .frozen .frame-bg,.frozen .tentacle path,.frozen .tentacle circle,.frozen .wordmark .l,
  .frozen .sub,.frozen .tagline,.frozen .meta,.frozen .spark::after,
  .replaying .frame-bg,.replaying .tentacle path,.replaying .tentacle circle,.replaying .wordmark .l,
  .replaying .sub,.replaying .tagline,.replaying .meta,.replaying .spark::after{animation:none}
  .frozen .frame-bg{opacity:1}.frozen .tentacle path{stroke-dashoffset:0}
  .frozen .tentacle circle,.frozen .wordmark .l,.frozen .sub,.frozen .tagline,.frozen .meta{opacity:1;transform:none}
  @container (max-width:430px){ .wordmark{font-size:clamp(24px,11.5cqw,70px)} .tentacle{width:min(30cqw,44%)} }
</style>
</head>
<body>
<main class="wrap">
  <section class="frame" aria-label="Bajamar Seafood and Tacos brand intro">
    <div class="frame-bg" aria-hidden="true"></div>
    <div class="spark" aria-hidden="true"></div>
    <div class="inner">
      <svg class="tentacle" viewBox="0 0 200 120" aria-hidden="true">
        <path d="M18 108 C18 64 36 26 78 26 C122 26 138 52 138 74 C138 100 116 112 92 112
                 C70 112 56 96 56 78 C56 62 68 50 84 50"/>
        <circle cx="26" cy="94" r="6"/>
        <circle cx="22" cy="70" r="5.4"/>
        <circle cx="30" cy="48" r="4.6"/>
      </svg>
      <div class="lockup">
        <h1 class="wordmark" data-text="BAJAMAR">BAJAMAR</h1>
        <div class="sub"><span class="rule"></span><span>SEAFOOD &amp; TACOS</span><span class="rule"></span></div>
      </div>
      <p class="tagline">Created in Baja. Born in Vegas.</p>
      <div class="meta">Southwest Las Vegas<span aria-hidden="true">&middot;</span>@bajamarlv</div>
    </div>
  </section>
  <div class="row">
    <span class="page-meta">Bajamar Seafood &amp; Tacos &middot; brand intro</span>
    <button class="replay" type="button">Replay</button>
    <a class="visit" href="./">Visit the site</a>
  </div>
</main>
<script>
(function(){
  var wm = document.querySelector('.wordmark');
  if(wm){
    var text = wm.getAttribute('data-text') || wm.textContent;
    wm.textContent = '';
    var i = 0;
    text.split('').forEach(function(ch){
      var span = document.createElement('span');
      span.className = 'l'; span.textContent = ch; span.style.setProperty('--i', i++);
      wm.appendChild(span);
    });
  }
  var frame = document.querySelector('.frame');
  if(/final/.test(location.search + location.hash) && frame){ frame.classList.add('frozen'); }
  var btn = document.querySelector('.replay');
  if(btn && frame){
    btn.addEventListener('click', function(){
      frame.classList.remove('frozen');
      frame.classList.add('replaying');
      void frame.offsetWidth;
      frame.classList.remove('replaying');
    });
  }
})();
</script>
</body>
</html>
